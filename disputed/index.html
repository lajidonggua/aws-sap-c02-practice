<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AWS SAP-C02 - 争议题</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;
  background: #2d2d2d;
  color: #e0e0e0;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}
.container {
  max-width: 1000px;
  margin: 0 auto;
  padding:
    max(12px, env(safe-area-inset-top))
    max(12px, env(safe-area-inset-right))
    max(12px, env(safe-area-inset-bottom))
    max(12px, env(safe-area-inset-left));
  width: 100%;
}
.header {
  background: #3a3a3a;
  border-radius: 10px;
  padding: clamp(14px, 3.5vw, 20px) clamp(14px, 3.5vw, 25px);
  margin-bottom: 20px;
}
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 12px;
}
.title { font-size: clamp(1.2rem, 4.5vw, 1.5rem); color: #ff9800; font-weight: bold; line-height: 1.3; word-break: break-word; }
.subtitle { font-size: 14px; color: #aaa; margin-top: 4px; line-height: 1.5; word-break: break-word; }
.back-link {
  color: #4fc3f7;
  text-decoration: none;
  font-size: 14px;
  padding: 8px 16px;
  border: 1px solid #4fc3f7;
  border-radius: 6px;
  transition: all 0.2s;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.back-link:hover { background: #4fc3f7; color: #1a1a1a; }
.search-box {
  width: 100%;
  padding: 12px 16px;
  background: #4a4a4a;
  border: 1px solid #555;
  border-radius: 8px;
  color: #e0e0e0;
  font-size: 16px;
  outline: none;
}
.search-box:focus { border-color: #ff9800; }
.search-box::placeholder { color: #888; }
.stats-bar {
  display: flex;
  gap: 12px;
  margin-top: 12px;
  font-size: 13px;
  color: #aaa;
  flex-wrap: wrap;
  line-height: 1.5;
}
.stat-highlight { color: #ff9800; font-weight: bold; }
.disputed-list { display: flex; flex-direction: column; gap: 12px; }
.disputed-card {
  background: #3a3a3a;
  border-radius: 10px;
  padding: clamp(14px, 3vw, 18px) clamp(14px, 3vw, 20px);
  border-left: 4px solid #ff9800;
  transition: background 0.2s;
  min-width: 0;
}
.disputed-card:hover { background: #404040; }
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.card-id {
  font-size: clamp(1rem, 3.5vw, 1.125rem);
  font-weight: bold;
  color: #ff9800;
}
.card-badges { display: flex; gap: 8px; flex-wrap: wrap; }
.badge {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 12px;
  font-weight: bold;
  word-break: break-word;
}
.badge-current { background: #1b5e20; color: #a5d6a7; }
.badge-community { background: #4a148c; color: #e1bee7; }
.badge-vote { background: #4a4a4a; color: #ccc; }
.card-reason {
  font-size: 14px;
  color: #ccc;
  line-height: 1.6;
  margin-bottom: 12px;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.card-preview {
  font-size: 13px;
  color: #888;
  line-height: 1.5;
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}
.practice-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #4fc3f7;
  text-decoration: none;
  font-size: 14px;
  padding: 8px 14px;
  border: 1px solid #4fc3f7;
  border-radius: 6px;
  transition: all 0.2s;
  min-height: 40px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.practice-link:hover { background: #4fc3f7; color: #1a1a1a; }
.empty-msg {
  text-align: center;
  color: #888;
  padding: 40px 16px;
  font-size: 15px;
}

@media (max-width: 640px) {
  .header-top { flex-direction: column; align-items: stretch; }
  .back-link { align-self: flex-start; }
  .card-top { flex-direction: column; align-items: stretch; gap: 8px; }
  .practice-link { width: 100%; text-align: center; }
}

@media (max-width: 400px) {
  .badge { font-size: 11px; padding: 3px 8px; }
  .subtitle br { display: none; }
}
</style>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="theme-color" content="#1d6a52">
<link rel="stylesheet" href="../pwa.css?v=install1">
<script src="../pwa.js?v=install1" defer></script>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="title">⚠️ 争议题专区</div>
        <div class="subtitle">
          以下题目的当前答案与社区投票尚未达成共识。<br>
          建议自行判断后再参考；练习时答完才会显示详细说明。
        </div>
      </div>
      <a href="../index.html" class="back-link">← 返回主选单</a>
    </div>
    <input type="text" class="search-box" id="searchBox" placeholder="搜寻题号或题目内容…" oninput="renderList()">
    <div class="stats-bar">
      共 <span class="stat-highlight" id="totalCount">0</span> 道争议题
      <span id="filterCount"></span>
    </div>
  </div>
  <div class="disputed-list" id="disputedList"></div>
</div>

<script src="../sap_questions.js?v=simplified1"></script>
<script>
const QUESTIONS = CHOICE_QUESTIONS;
const DISPUTED = typeof DISPUTED_QUESTIONS !== 'undefined' ? DISPUTED_QUESTIONS : {};

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function getQuestion(qid) {
  return QUESTIONS.find(q => q.id === Number(qid));
}

function renderList() {
  const query = document.getElementById('searchBox').value.trim().toLowerCase();
  const list = document.getElementById('disputedList');
  const ids = Object.keys(DISPUTED).map(Number).sort((a, b) => a - b);

  document.getElementById('totalCount').textContent = ids.length;

  const filtered = ids.filter(qid => {
    if (!query) return true;
    const q = getQuestion(qid);
    const meta = DISPUTED[qid] || DISPUTED[String(qid)];
    const haystack = [
      `q${qid}`,
      String(qid),
      meta?.reason,
      meta?.current,
      meta?.community,
      q?.question,
      q?.question_zh,
    ].filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(query);
  });

  document.getElementById('filterCount').textContent =
    query ? `（筛选显示 ${filtered.length} 题）` : '';

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-msg">没有符合条件的争议题</div>';
    return;
  }

  list.innerHTML = filtered.map(qid => {
    const meta = DISPUTED[qid] || DISPUTED[String(qid)];
    const q = getQuestion(qid);
    const preview = q ? escapeHtml(q.question) : '';
    return `
      <div class="disputed-card">
        <div class="card-top">
          <div class="card-id">Question ${qid}</div>
          <div class="card-badges">
            <span class="badge badge-current">当前: ${meta.current}</span>
            <span class="badge badge-community">社区: ${meta.community}</span>
            <span class="badge badge-vote">${meta.vote}</span>
          </div>
        </div>
        ${preview ? `<div class="card-preview">${preview}</div>` : ''}
        <div class="card-reason">${escapeHtml(meta.reason)}</div>
        <a class="practice-link" href="../choice/index.html?q=${qid}">去做这道题 →</a>
      </div>
    `;
  }).join('');
}

renderList();
</script>
</body>
</html>
