<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAP 刷题 · 5 秒闪记</title><link rel="stylesheet" href="quick.css?v=simplified1"><link rel="stylesheet" href="twenty_review.css?v=simplified1"></head><body>
<header><a class="brand" href="index.html">SAP <span>刷题手册</span></a><span class="muted">AWS SAP-C02 · 科目一式练习</span></header>
<main><section class="intro"><div><div class="eyebrow">考前冲刺 · 529 题闪记</div><h1>看题眼，找答案词，当场做题。</h1><p>顺序刷题已内置 5 秒闪记。提示不显示答案字母，选完再核对。</p></div><div class="stats" id="stats"></div></section>
<nav id="modes" aria-label="练习模式"><button data-mode="order" class="active">顺序刷题 · 闪记提示</button><button data-mode="flash">单独闪记</button><button data-mode="random">随机练习</button><button data-mode="wrong">错题重练 <span id="wrongCount">0</span></button><button data-mode="star">我的收藏</button><button data-mode="memory">直接背题</button><button data-mode="keywords">关键词速查</button></nav>
<section id="keywordTools"><label for="keywordSearch">搜题眼或答案词</label><input id="keywordSearch" type="search" placeholder="例如：固定 IP、DNS、S3、密码、NAT"><p id="keywordCount" class="muted"></p></section><div class="layout"><section class="card" id="practice"><div class="toolbar"><span id="position"></span><button id="star" class="quiet">☆ 收藏</button></div><div class="progress"><div id="progress"></div></div><div id="question"></div><div id="options"></div><button id="submit" class="primary" hidden>确认答案</button><div id="feedback" aria-live="polite"></div><div class="actions"><button id="prev">上一题</button><span id="selection" class="muted"></span><button id="next" class="primary">下一题 →</button></div></section>
<aside><section class="sidecard"><div class="eyebrow">只记这一行</div><h2>题眼 → 答案词</h2><ol><li><b>两个条件一起看</b><br>例如 S3 + NAT 费高。</li><li><b>去选项里找词</b><br>网关端点。</li><li><b>只防一个坑</b><br>入口 IP ≠ 出站 IP。</li></ol></section><section class="sidecard"><label for="jump">跳到题号</label><form id="jumpForm"><input id="jump" type="number" min="1" placeholder="例如 28" required><button>前往</button></form><p class="muted" id="saveNote">进度、错题和收藏自动保存在本浏览器。</p></section><section class="sidecard links"><span class="eyebrow">专项练习</span><a href="multi/index.html">多选题专练 ↗</a><a href="exam/index.html">计时模拟考 ↗</a><a href="disputed/index.html">争议题专区 ↗</a><a href="choice/index.html">原版题库 ↗</a></section></aside></div>
<footer>每题速记依据当前题库和原解析整理；长解析按需展开。争议题按题库答案判分，并保留提示。</footer></main>
<script src="sap_questions.js?v=simplified1"></script><script src="sap_explanations.js?v=simplified1"></script><script src="quick_memory.js?v=simplified1"></script><script src="keyword_cards.js?v=simplified1"></script><script src="quick_answer_cards.js?v=simplified1"></script><script src="twenty_review.js?v=simplified1"></script><script src="flash_cards.js?v=simplified1"></script><script src="quick.js?v=simplified1"></script><script src="flash.js?v=simplified1"></script></body></html>
